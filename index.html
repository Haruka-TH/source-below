<style>
  :root {
    --bg: #050805;
    --green: #33ff66;
    --green-dim: #1a8c38;
    --green-glow: rgba(51, 255, 102, 0.45);
    --red: #ff4444;
    --font: "Consolas", "Courier New", "Noto Sans Mono CJK TC", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--green);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.7;
  }
  ::selection { background: var(--green); color: #000; }

  /* CRT 掃描線與暗角 */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.25) 3px);
    z-index: 50;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.7) 100%);
    z-index: 51;
  }

  .terminal {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 16px 80px;
    text-shadow: 0 0 6px var(--green-glow);
  }
  .titlebar {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--green-dim);
    padding-bottom: 8px; margin-bottom: 24px;
    font-size: 14px; color: var(--green-dim);
    gap: 12px; flex-wrap: wrap;
  }
  .titlebar button {
    background: none; border: 1px solid var(--green-dim); color: var(--green-dim);
    font-family: var(--font); font-size: 13px; padding: 2px 10px; cursor: pointer;
  }
  .titlebar button:hover { color: var(--green); border-color: var(--green); }

  .banner { margin: 0 0 22px; }
  .banner .t1 { font-size: 30px; letter-spacing: .3em; }
  .banner .t2 { font-size: 13px; letter-spacing: .35em; color: var(--green-dim); }

  .line { white-space: pre-wrap; word-break: break-word; min-height: 1.7em; }
  .dim { color: var(--green-dim); }
  .err { color: var(--red); text-shadow: 0 0 6px rgba(255,68,68,.5); }

  .cursor::after {
    content: "█";
    animation: blink 1s steps(1) infinite;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .prompt-row {
    display: flex; align-items: center; gap: 8px; margin-top: 18px;
  }
  .prompt-row label { white-space: nowrap; }
  .prompt-row input {
    flex: 1; min-width: 0;
    background: transparent; border: none; outline: none;
    color: var(--green); font-family: var(--font); font-size: 17px;
    caret-color: var(--green); text-shadow: 0 0 6px var(--green-glow);
    border-bottom: 1px dashed var(--green-dim);
    padding: 4px 0;
  }
  .btn {
    background: transparent; color: var(--green);
    border: 1px solid var(--green); font-family: var(--font); font-size: 15px;
    padding: 6px 16px; cursor: pointer; margin-top: 18px; margin-right: 10px;
    text-shadow: inherit;
  }
  .btn:hover { background: var(--green); color: #000; text-shadow: none; }
  .hidden { display: none !important; }

  /* 第一關：與背景同色的隱藏文字 */
  .void {
    color: var(--bg); text-shadow: none;
    margin: 28px 0; padding: 40px 0;
    white-space: pre-wrap;
    user-select: text;
  }

  .shake { animation: shake .35s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .overlay {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 10, 0, .9);
    font-size: clamp(28px, 7vw, 64px); letter-spacing: .12em;
    text-shadow: 0 0 18px var(--green), 0 0 40px var(--green);
    animation: flash 1.4s forwards;
  }
  @keyframes flash {
    0% { opacity: 0; } 10% { opacity: 1; } 20% { opacity: .3; } 30% { opacity: 1; }
    80% { opacity: 1; } 100% { opacity: 0; }
  }

  .review { border: 1px solid var(--green-dim); padding: 12px 16px; margin: 20px 0; }
  .review .head { margin-bottom: 8px; }
  .review .item { margin: 8px 0; }
  .review .item .desc { color: var(--green-dim); padding-left: 2.2em; }
  .mobile-warn {
    border: 1px dashed var(--red); color: var(--red);
    padding: 10px 14px; margin-bottom: 20px; font-size: 14px;
  }

  /* ===== 結局：系統崩壞 ===== */
  body.corrupt .terminal { animation: jitter .12s infinite; }
  body.corrupt .line { color: var(--red); text-shadow: 2px 0 var(--green), -2px 0 rgba(255,0,255,.6); }
  @keyframes jitter {
    0%   { transform: translate(0, 0) skewX(0); filter: none; }
    25%  { transform: translate(-3px, 1px) skewX(-2deg); }
    50%  { transform: translate(2px, -2px) skewX(1deg); filter: hue-rotate(40deg); }
    75%  { transform: translate(-1px, 2px) skewX(0); }
    100% { transform: translate(0, 0); filter: none; }
  }
  .garbage { word-break: break-all; opacity: .9; }

  .final {
    position: fixed; inset: 0; z-index: 45;
    background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; text-align: center; padding: 16px;
    animation: fadeIn 1.2s ease forwards;
  }
  .final .warn {
    font-size: clamp(30px, 8vw, 72px); color: var(--red);
    text-shadow: 0 0 20px rgba(255,68,68,.8);
    letter-spacing: .15em;
  }
  .final .sub { color: var(--green-dim); letter-spacing: .4em; font-size: 14px; }
  .final.out { animation: fadeOut 1.6s ease forwards; }
  .final.out .warn, .final.out .sub { animation: fadeOut 1.2s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
</style>

<script>
/* ================================================================
   原始碼之下 BELOW THE SOURCE CODE :: 主程式
   答案不以明文儲存，只存雜湊值。想偷看？換個地方找吧。
   ================================================================ */
(() => {
  const HASH = ["beaa751c", "91f30d4a", "7c2b9461"];
  const STORE_KEY = "source-below-progress";

  const hash = (s) => {
    let x = 5381;
    for (const c of s) x = ((x << 5) + x + c.codePointAt(0)) >>> 0;
    return x.toString(16);
  };
  const norm = (s) => String(s).trim().toUpperCase().replace(/\s+/g, "");

  const store = {
    load() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || null; } catch { return null; }
    },
    save(d) { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch {} },
    clear() { try { localStorage.removeItem(STORE_KEY); } catch {} }
  };

  /* level：0 開場、1~3 關卡、4 結局
     loops：看過結局的次數（循環重啟後保留，只有「重置進度」會清除） */
  const fresh = (loops = 0) => ({ level: 0, wrong: 0, levelWrong: 0, start: null, end: null, loops });
  let state = Object.assign(fresh(), store.load() || {});

  const $screen = document.getElementById("screen");
  const $tag = document.getElementById("levelTag");
  let typingToken = 0;
  let isTyping = false;     // 打字動畫是否進行中
  let skipTyping = false;   // 按 Enter 可跳過打字動畫
  let onEnter = null;       // 目前畫面按下 Enter 要執行的動作

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  async function typeLines(lines, token, speed = 22) {
    isTyping = true;
    skipTyping = false;
    for (const item of lines) {
      if (token !== typingToken) { isTyping = false; return false; }
      const { text, cls } = typeof item === "string" ? { text: item } : item;
      const el = document.createElement("div");
      el.className = "line cursor" + (cls ? " " + cls : "");
      $screen.appendChild(el);
      for (const ch of text) {
        if (token !== typingToken) { isTyping = false; return false; }
        if (skipTyping) { el.textContent = text; break; }
        el.textContent += ch;
        await sleep(ch === " " ? 8 : speed);
      }
      el.classList.remove("cursor");
      if (!skipTyping) await sleep(text ? 120 : 60);
    }
    isTyping = false;
    return true;
  }

  /* ---------- 鍵盤控制 ----------
     - 打字動畫中按 Enter：直接顯示全部文字
     - 任何時候按 Enter：執行目前畫面的動作（開始 / 送出通行碼 / 讀取文件）
     - 輸入框沒有焦點時直接打字：自動把焦點移回輸入框
  */
  document.addEventListener("keydown", (e) => {
    // 注音、倉頡等輸入法選字中按 Enter 是確認選字，不要攔截
    if (e.isComposing || e.keyCode === 229) return;
    const input = $screen.querySelector("input");

    if (e.key === "Enter") {
      e.preventDefault();
      if (isTyping) { skipTyping = true; return; }
      if (typeof onEnter === "function") onEnter();
      return;
    }

    if (input && document.activeElement !== input &&
        e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      input.focus();
    }
  });

  function addHTML(html) {
    const wrap = document.createElement("div");
    wrap.innerHTML = html;
    $screen.appendChild(wrap);
    return wrap;
  }

  function shake() {
    const t = document.getElementById("terminal");
    t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
  }

  function grantedOverlay() {
    const o = document.createElement("div");
    o.className = "overlay";
    o.textContent = "ACCESS GRANTED";
    document.body.appendChild(o);
    setTimeout(() => o.remove(), 1400);
  }

  /* 答對：先印出該關的通關回應，再閃 ACCESS GRANTED，約 1.3 秒後進下一階段 */
  async function passLevel() {
    onEnter = null;   // 過關演出期間停用 Enter，避免重複送出
    const lv = LEVELS[state.level];
    const token = typingToken;
    if (lv.clear) {
      $screen.querySelectorAll("input, .btn").forEach(el => el.disabled = true);
      await typeLines(lv.clear, token, 14);
      if (token !== typingToken) return;
      await sleep(300);
    }
    grantedOverlay();
    state.level += 1;
    state.levelWrong = 0;
    if (state.level === 4) state.end = Date.now();
    store.save(state);
    setTimeout(() => { if (token === typingToken) render(); }, 1300);
  }

  /*
   * 第七研究區事故｜研究員 ██ 的私人備註
   *
   * 正式報告於事故後第三日完成。我曾要求補入失聯人員名單，
   * 但每次儲存後，名單都會消失，報告也恢復為「無人員傷亡」。
   * 目前已重試十七次。系統紀錄裡找不到任何人執行回復操作。
   *
   * 我不敢再修改正式文件，只能將這段紀錄留在備份副本。
   * 若你還在讀這段註解，代表這份副本還沒有被刪除。
   */
  /*
   * B——備份副本一直留在檔案庫的角落。
   * A——我把每次回復的時間都抄了下來。
   * C——控制室的人以為那只是設備雜訊。
   * K——開啟它的方法，我只留給能讀懂這段話的人。
   * D——但我知道它還在那裡，等著被讀到。
   * O——原始版本無法覆寫，這一點我確定。
   * O——若你讀到這裡，就照我的順序看下去。
   * R——然而系統不允許我留下任何名字。
   */
  /* ---------- 關卡資料 ---------- */
/*
 * SCP-███-TW｜內部修訂備註
 * 事故結案後，附件目錄曾出現一筆未經核准的變更。
 * 我已將原始值班名冊另存，但無法確認副本是否完整。
 * 值班室的人總說，真正能進入封存區的不是正門，而是留給維護人員的那條後路。
 * ——研究員 ██
 */

  const LEVELS = {
    1: {
      tag: "level_01.exe",
      intro: [
        { text: "> 正在載入文件存取介面……", cls: "dim" },
        { text: "> LOCK LAYER: 1 / 3", cls: "dim" },
        "",
        "> 第一層鎖定程序已啟用。",
        "",
        "> 文件編號：SCP-███-TW",
        "> 文件類型：第七研究區事故結案報告",
        "> 核准狀態：已結案",
        "> 官方結論：未發現人員傷亡。",
        "",
        "【檔案閱覽備註】",
        "本文件於事故後第三日核准結案。",
        "事故當晚的值班紀錄並未隨結案報告保存。",
        "部分內容在不同版本之間存在差異，原因尚未釐清。",
        "本次閱覽僅能確認目前留存的正式版本。"
      ],
      hidden: `SCP-███-TW｜附件 1-A：研究員個人紀錄（未納入正式檔案）
撰寫人：研究員 ██　　日期：20██/██/██
狀態：未經審核；原始紙本已封存

【事件前】
當晚我負責確認第七研究區的隔離程序。例行檢查沒有發現異常，值班名冊上共有四名研究人員在區域內。23:12，我收到控制室通知，要求暫停該區域所有對外通訊。通知沒有附上原因。

【事件紀錄】
23:17，隔離門自動關閉。門鎖完成後，內線通訊仍維持了約兩分鐘。我聽見三次敲擊聲，間隔大致相同。當時我以為是人員依照緊急程序發出的求援訊號，因此要求控制室重新開啟通訊。我的請求未獲回覆。
23:21，監視畫面全部中斷。23:26，控制室的接收設備短暫收到一段求救訊號，內容無法辨識。不到一分鐘，訊號停止。

【事後核對】
隔日上午，我查閱事故結案報告。報告稱：「隔離程序正常完成，區域內無人，未發現人員傷亡。」這與我當晚的值班紀錄不符。我曾要求調閱名冊及通訊紀錄，主管只回覆：「現場沒有其他人員，請依正式版本歸檔。」

我重新核對了值班表。四個名字仍然在上面，但在事故報告的附件中，相關欄位已被刪除。我無法解釋這項差異，也不願在沒有證據的情況下指控任何人。可是，我確定自己當晚聽見了門內的敲擊聲。

【補記｜三日後】
我嘗試將上述內容補入事故報告。儲存完成後，文件自行恢復成已核准版本；修訂紀錄沒有留下我的操作。這不是第一次發生。我已將這份紀錄另存於備份區，並把查找線索藏在原始檔案裡。若你能讀到這段文字，代表這份副本至少還沒有被完全清除。

補記：事故前，值班室偶爾會流傳一段關於「空無一人的走廊」的舊說法。沒有人承認真的見過什麼，但每當感應器在空走廊裡觸發，大家就會用那個英文詞互相提醒。

P——監視畫面裡，走廊始終空無一人。
H——然而門禁紀錄顯示，有東西曾在裡面停留。
A——警報沒有故障，感應器也通過了檢查。
N——沒有人願意在報告上解釋這項矛盾。
T——值夜的人只把這件事當作玩笑，從不在正式紀錄裡提起。
O——偶爾有人說，空白的畫面不代表那裡什麼都沒有。
M——每次聽見這個說法，主管就會要求停止討論。

我原本以為這只是值班室裡的怪談。直到第七研究區出事，我才想起這幾句話。
若這份紀錄還能被讀到，至少代表我沒有把最後一份副本弄丟。

——研究員 ██`,
      clear: [
        "> ACCESS GRANTED",
        "> 第一層鎖定程序已解除。",
        { text: "> 正在檢查下一層鎖定程序……", cls: "dim" }
      ],
      hint: "提示：檢查文件版面中看似空白的區域，並留意選取文字後是否出現不同內容。"
    },
    2: {
      tag: "level_02.exe",
      intro: [
        { text: "> 第一層鎖定程序已解除。", cls: "dim" },
        { text: "> 正在進入第二層……", cls: "dim" },

        "其中最後一筆的時間，甚至晚於本次檔案的建立時間。",
        "我無法判斷這是紀錄錯誤，還是有人刻意抹去了操作痕跡。",
        "",
        "正式列印件到此為止。研究員留下的副本，似乎還保有一些未被歸檔的痕跡。"
      ],
      clear: [
        "> ACCESS GRANTED",
        "> 第二層鎖定程序已解除。",
        "> 偵測到管理員權限驗證程序。",
        { text: "> 正在進入最後一層……", cls: "dim" }
      ],
      hint: "提示：目前看到的只是文件呈現出來的樣子。想想看，這份文件在被顯示之前，還會以什麼形式存在？也許網頁本身，比它顯示的樣子更誠實。"
    },
    3: {
      tag: "level_03.exe",
      intro: [
        { text: "> 第二層鎖定程序已解除。", cls: "dim" },
        { text: "> 正在進入第三層……", cls: "dim" },
        "",
        { text: "> LOCK LAYER: 3 / 3", cls: "dim" },
        { text: "> ACCESS RESTRICTION: MAXIMUM", cls: "dim" },
        "",
        { text: "[警告] 系統已鎖定，此畫面不接受任何輸入。", cls: "err" },
        "",
        "備份資料顯示，原始紀錄仍然存在。",
        "但檔案的存取權限已被改寫，連建立這份紀錄的人也無法開啟。",
        "研究員最後一次值班時，曾在工作紀錄裡留下幾行未被正式介面收錄的文字。"
      ],
      hint: "提示：有些工作紀錄不會出現在一般文件介面裡。想想研究員在排查系統問題時，還可能透過哪種工具留下訊息。"
    }
  };

  /* ---------- 畫面切換 ---------- */
  async function render() {
    typingToken++;
    const token = typingToken;
    onEnter = null;
    document.body.classList.remove("corrupt");
    document.querySelectorAll(".final").forEach(el => el.remove());
    $screen.innerHTML = "";

    if (state.level === 0) return renderBoot(token);
    if (state.level === 4) return renderEnding(token);

    const lv = LEVELS[state.level];
    $tag.textContent = lv.tag;
    // 看過結局後回到第一關，會多出一行異常痕跡
    const intro = (state.level === 1 && state.loops > 0)
      ? [{ text: "> 正在重新載入終端機……", cls: "dim" }, { text: "> 上次存取紀錄：已清除", cls: "err" }, "", ...lv.intro]
      : lv.intro;
    const done = await typeLines(intro, token);
    if (!done) return;

    if (lv.hidden) {
      const v = addHTML(`<div class="void"></div>`);
      v.firstChild.textContent = lv.hidden;
    }

    if (state.level === 3) {
      announceConsole();
      const box = addHTML(`
        <div class="line dim">> 等待主控台指令中……<span class="cursor"></span></div>
        <div id="hintArea"></div>
        <button class="btn ${state.levelWrong >= 3 ? "" : "hidden"}" id="hintBtn" type="button">[ 我需要提示 ]</button>`);
      box.querySelector("#hintBtn").onclick = () => showHint(lv.hint);
      return;
    }

    const box = addHTML(`
      <div class="prompt-row">
        <label for="answer">ENTER PASSCODE&gt;</label>
        <input id="answer" type="text" spellcheck="false" autocomplete="off" aria-label="輸入通行碼">
      </div>
      <button class="btn" id="submitBtn" type="button">[ 送出 ]</button>
      <button class="btn ${state.levelWrong >= 3 ? "" : "hidden"}" id="hintBtn" type="button">[ 我需要提示 ]</button>
      <div id="feedback"></div>
      <div id="hintArea"></div>`);
    const input = box.querySelector("#answer");
    input.focus();
    const submit = () => {
      if (!norm(input.value)) { input.focus(); shake(); return; }
      check(input.value, box);
    };
    onEnter = submit;
    box.querySelector("#submitBtn").onclick = submit;
    box.querySelector("#hintBtn").onclick = () => showHint(lv.hint);
  }

  function showHint(text) {
    const area = document.getElementById("hintArea");
    if (area && !area.textContent) {
      area.innerHTML = `<div class="line dim" style="margin-top:14px"></div>`;
      area.firstChild.textContent = text;
    }
  }

  function check(value, box) {
    const fb = box.querySelector("#feedback");
    if (hash(norm(value)) === HASH[state.level - 1]) {
      fb.innerHTML = "";
      passLevel();
    } else {
      state.wrong++; state.levelWrong++;
      store.save(state);
      fb.innerHTML = `<div class="line err">> ACCESS DENIED：通行碼錯誤（本關第 ${state.levelWrong} 次）</div>`;
      shake();
      box.querySelector("#answer").select();
      if (state.levelWrong >= 3) box.querySelector("#hintBtn").classList.remove("hidden");
    }
  }

  /* ---------- 開場：init.exe ---------- */
  async function renderBoot(token) {
    $tag.textContent = "init.exe";
    addHTML(`<div class="banner"><div class="t1">原始碼之下</div><div class="t2">BELOW THE SOURCE CODE</div></div>`);
    addHTML(`
      <div class="review" style="margin-bottom:24px">
        <div class="head">【發現紀錄｜未分類】</div>
        <div class="item">我們偶然發現了一份被上鎖的檔案。</div>
        <div class="item">檔案沒有標示完整名稱，內容也無法直接讀取；畫面只顯示仍有三道鎖定程序啟用。</div>
        <div class="item">我們不知道裡面保存著什麼，也不清楚為什麼需要如此嚴密的保護。</div>
        <div class="item">但既然已經發現了它，我們想知道這份檔案究竟藏著什麼。</div>
        <div class="item">若要查看內容，就只能依序解開三道鎖。</div>
      </div>`);
    if (matchMedia("(pointer: coarse)").matches) {
      addHTML(`<div class="mobile-warn">[注意] 本解謎需要檢視原始碼與開發者工具，建議改用電腦開啟。</div>`);
    }
    const lines = [{ text: "> 正在載入終端機……", cls: "dim" }];
    lines.push(
      "",
      { text: "> 正在連線至中央檔案資料庫……", cls: "dim" },
      "> CONNECTION ESTABLISHED",
      "",
      "> 偵測到一份未知來源的封存檔案。",
      "> FILE ID: SCP-███-TW",
      "> FILE STATUS: LOCKED",
      "> ACCESS LEVEL: DENIED",
      "> LOCKS ACTIVE: 3 / 3",
      "",
      "> 檔案內容無法讀取。",
      "> 請依序解除三道鎖定程序，以查看檔案內容。",
      { text: "  （按 Enter 開始，或輸入 START）", cls: "dim" }
    );
    const done = await typeLines(lines, token);
    if (!done) return;

    const box = addHTML(`
      <div class="prompt-row">
        <label for="startInput">C:\\&gt;</label>
        <input id="startInput" type="text" spellcheck="false" autocomplete="off" aria-label="按 Enter 開始">
      </div>
      <button class="btn" id="startBtn" type="button">[ START ]</button>`);
    const input = box.querySelector("#startInput");
    const begin = () => {
      state = fresh(state.loops); state.level = 1; state.start = Date.now();
      store.save(state); render();
    };
    box.querySelector("#startBtn").onclick = begin;
    onEnter = () => {
      const v = norm(input.value);
      if (v === "" || v === "START") begin();
      else { shake(); input.select(); }
    };
    input.focus();
  }

  /* ---------- 結局：root_access.exe ----------
     流程：技巧回顧 → 宣告已解開檔案 → 列出原始文件 → 列到一半開始亂碼
           → 亂碼淹沒畫面 → 「你知道的太多了」→ 黑畫面 → 回到第一關
  */

  // 等待指定毫秒，或玩家按 Enter 提早繼續
  function waitOrEnter(ms, token) {
    return new Promise((resolve) => {
      const done = () => { clearTimeout(t); onEnter = null; resolve(token === typingToken); };
      const t = setTimeout(done, ms);
      onEnter = done;
    });
  }

  const GLYPHS = "█▓▒░#@$%&*!?/\\|<>ŦĐØ∆¥§¤0123456789ABCDEF";
  const ZALGO = ["̀","́","̃","̈","̋","̐","̕","̛","̢","̧","̨","̶","̸","ͅ","͜","͡"];
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const glitchChar = () => pick(GLYPHS) + (Math.random() < .5 ? pick(ZALGO) + pick(ZALGO) : "");
  const noise = (n) => Array.from({ length: n }, glitchChar).join("");
  // 依比例把一行字的部分字元換成亂碼（ratio 0 = 原文，1 = 全亂碼）
  const corruptText = (text, ratio) =>
    Array.from(text).map(ch => (ch !== " " && Math.random() < ratio) ? glitchChar() : ch).join("");

  // 原始文件內容：以研究員事故報告的形式呈現，隨後出現異常新增紀錄
  function documentLines() {
    const now = new Date().toLocaleString("zh-TW", { hour12: false });
    return [
      "==================================================",
      "SCP-███-TW｜第七研究區事故調查報告",
      "撰寫人：研究員 ██　　狀態：未核准存檔",
      "==================================================",
      "",
      "一、事故摘要",
      "20██ 年 ██ 月 ██ 日，研究區隔離程序於 23:17 啟動。",
      "其後監視系統中斷，控制室收到來自區域內的求救訊號。",
      "系統卻在 23:27 回報該區域無人，並將事件標記為設備異常。",
      "",
      "二、現場紀錄與正式報告的差異",
      "正式報告：事故未造成任何人員傷亡。",
      "現場紀錄：研究人員 ██ 名於隔離程序啟動後失去聯繫。",
      "兩份紀錄無法同時成立。我已要求重新調查，申請未獲回覆。",
      "",
      "三、文件異常",
      "我曾十七次嘗試補回失聯人員名單。",
      "每次儲存後，名單都會消失，文件也恢復為已核准版本。",
      "版本歷程中沒有相應的修改者或回復紀錄。",
      "",
      "四、個人備註",
      "我不認為這只是資料庫故障。若只是故障，應該能找到原因，",
      "但這份文件似乎只在有人試圖記下失聯者時才會改變。",
      "我將原始紀錄另存於備份區，並停止修改正式報告。",
      "",
      "——研究員 ██",
      "以下欄位不屬於本報告原始內容：",
      "新增存取紀錄：",
      "存取者：" + "目前正在閱讀本文件的人",
      "存取時間：" + now,
      "狀態：已記錄",
      "備註：研究員 ██，觀測程序已重新啟動。"
    ];
  }
  const CORRUPT_FROM = 16;   // 第幾行開始出現亂碼（大約列到一半）

  async function renderEnding(token) {
    $tag.textContent = "root_access.exe";
    onEnter = null;

    // 1. 解鎖成功 + 技巧回顧
    let ok = await typeLines([
      "> ACCESS GRANTED",
      "> ROOT ACCESS CONFIRMED",
      "",
      "> 原始文件已重新開啟。"
    ], token);
    if (!ok) return;

    const secs = Math.max(0, Math.round(((state.end || Date.now()) - (state.start || Date.now())) / 1000));
    addHTML(`
      <div class="review">
        <div class="line head">// 你在這次入侵中學到的技巧</div>
        <div class="item"><div class="line">01. 反白選取</div><div class="line desc">隱藏在背景中的文字，選取後即可顯現。</div></div>
        <div class="item"><div class="line">02. 檢視原始碼</div><div class="line desc">HTML 註解不會顯示在一般網頁畫面，但可以透過檢視原始碼找到。</div></div>
        <div class="item"><div class="line">03. 開發者工具 Console</div><div class="line desc">可以查看系統訊息，也能在其中呼叫網頁提供的 JavaScript 函式。</div></div>
        <div class="line dim" style="margin-top:10px">花費時間：${Math.floor(secs / 60)} 分 ${secs % 60} 秒 ｜ 答錯次數：${state.wrong} 次</div>
      </div>`);
    window.scrollTo(0, document.body.scrollHeight);
    if (!(await waitOrEnter(1800, token))) return;

    // 2. 宣告已解開檔案
    ok = await typeLines([
      "",
      "> 你已經取得 ROOT 權限。",
      { text: "> RESTORING ORIGINAL DOCUMENT...", cls: "dim" },
      "> ORIGINAL REPORT RESTORED",
      { text: "> 正在載入研究員 ██ 的未核准報告……", cls: "dim" },
      ""
    ], token);
    if (!ok) return;
    await sleep(500);

    // 3. 列出文件，列到一半開始崩壞
    const docs = documentLines();
    for (let i = 0; i < docs.length; i++) {
      if (token !== typingToken) return;
      let text = docs[i], cls = "";
      if (i >= CORRUPT_FROM) {
        const ratio = Math.min(.85, .08 + (i - CORRUPT_FROM) * .07);
        text = corruptText(text, ratio);
        cls = i - CORRUPT_FROM > 4 ? "err garbage" : "garbage";
        if (i === CORRUPT_FROM) shake();
      }
      ok = await typeLines([{ text, cls }], token, i >= CORRUPT_FROM ? 18 : 12);
      if (!ok) return;
      window.scrollTo(0, document.body.scrollHeight);
      // 已經印出的文字也會被回頭污染
      if (i > CORRUPT_FROM + 3) {
        const rows = $screen.querySelectorAll(".line");
        for (let k = 0; k < 2; k++) {
          const r = pick(Array.from(rows));
          r.textContent = corruptText(r.textContent, .5);
        }
      }
    }

    // 4. 亂碼淹沒畫面
    document.body.classList.add("corrupt");
    const scripted = ["> ERROR: 0x0000████", "> ████████████████████████", "> SYSTEM ERROR", "> ACCESS TERMINATED"];
    for (let i = 0; i < 40; i++) {
      if (token !== typingToken) return;
      const el = document.createElement("div");
      el.className = "line garbage";
      el.textContent = i % 10 === 5 ? scripted[Math.floor(i / 10)] : "> " + noise(20 + Math.floor(Math.random() * 40));
      $screen.appendChild(el);
      window.scrollTo(0, document.body.scrollHeight);
      const rows = $screen.querySelectorAll(".line");
      const r = pick(Array.from(rows));
      r.textContent = noise(Math.max(8, Math.min(60, r.textContent.length)));
      await sleep(Math.max(25, 120 - i * 3));
    }
    console.log("%c你知道的太多了！", "color:#ff4444;font-size:18px;font-weight:bold;");
    await sleep(400);
    if (token !== typingToken) return;

    // 5. 「你知道的太多了」
    document.body.classList.remove("corrupt");
    $screen.innerHTML = "";
    const fin = document.createElement("div");
    fin.className = "final";
    fin.innerHTML = `<div class="warn">你知道的太多了！</div><div class="sub">CONNECTION TERMINATED</div>`;
    document.body.appendChild(fin);
    await sleep(3600);
    if (token !== typingToken) return;

    // 6. 黑畫面
    fin.classList.add("out");
    await sleep(2400);
    if (token !== typingToken) return;

    // 7. 回到第一關（保留「看過結局」的紀錄）
    state = fresh((state.loops || 0) + 1);
    state.level = 1;
    state.start = Date.now();
    announced = false;
    store.save(state);
    render();
  }

  /* ---------- 第三關：主控台 ---------- */
  let announced = false;
  function announceConsole() {
    if (announced) return;
    announced = true;
    const big = "color:#33ff66;background:#000;font-size:15px;font-family:monospace;padding:6px 10px;";
    const s = "color:#33ff66;background:#000;font-family:monospace;padding:4px 10px;";
    const w = "color:#ff4444;background:#000;font-family:monospace;padding:4px 10px;";
    console.log("%c【研究員 ██｜未存檔的工作紀錄】", big);
    console.log("%c我已核對過三次時間戳記。它們沒有錯。", s);
    console.log("%c23:17 隔離程序啟動；23:21 監視訊號中斷。", s);
    console.log("%c23:26 控制室收到求救訊號；23:27 系統記錄區域內無人。", w);
    console.log("%c正式報告稱沒有失聯者，但我親自接收過那些訊號。", w);
    console.log("%c我把原始紀錄留在備份區，卻再也無法從檔案庫開啟它。", s);
    console.log("%c如果這份備註被別人讀到，請不要把它當成證據的終點。", w);
    console.log("%c備註：檔案庫的舊式存取函式仍可呼叫。", s);
    console.log("%c我曾用兩個不同階段的識別詞確認過它，但不確定這份副本是否仍然有效。", s);
    console.log('%cunlock("……")', s);
  }

  window.unlock = function (pw) {
    if (state.level !== 3) {
      console.log("%c[系統] 你還沒走到這一步。", "color:#ff4444");
      return "ACCESS DENIED";
    }
    if (hash(norm(pw ?? "")) === HASH[2]) {
      passLevel();
      return "ACCESS GRANTED";
    }
    state.wrong++; state.levelWrong++;
    store.save(state);
    shake();
    const hb = document.getElementById("hintBtn");
    if (state.levelWrong >= 3 && hb) hb.classList.remove("hidden");
    if (state.levelWrong >= 2) {
      console.log("%c[管理員] 小提示：\n第一關的通行碼 + 第二關的通行碼，\n中間不要有空格。", "color:#1a8c38");
    }
    return "ACCESS DENIED";
  };

  /* ---------- 重置 ---------- */
  function reset() {
    store.clear();
    state = fresh();
    announced = false;
    render();
  }
  document.getElementById("resetBtn").onclick = () => {
    if (confirm("確定要清除所有進度與存取紀錄，從頭開始嗎？")) reset();
  };

  render();
})();
</script>
</body>
</html>
